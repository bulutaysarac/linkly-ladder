# Seviye 00: 1 replika, probe yok, graceful shutdown yok, 128Mi bellek limiti (OOM'u görmek için).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkly
  labels:
    app.kubernetes.io/name: linkly
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: linkly
  template:
    metadata:
      labels:
        app.kubernetes.io/name: linkly
    spec:
      containers:
        - name: linkly
          image: localhost:5001/linkly-ladder/00-linkly:IMAGE_TAG
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          # readinessProbe / livenessProbe YOK → P00-04
          # lifecycle.preStop YOK, terminationGracePeriodSeconds varsayılan 30 ama süreç SIGTERM'i işlemiyor → P00-04
