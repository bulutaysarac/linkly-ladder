# Altyapı bileşenlerinin KENDİ metrikleri (postgres_exporter, redis_exporter, redpanda admin).
#
# EN: They are easy to lose when the app is split (redirect/api at 07), and losing them fails
#     silently. `promq` returns "0" for a query with no series, so every script that asks "how
#     many DB connections?" or "what is Redis doing?" would measure zero and report "no problem"
#     (P07-02 would print max_connections=0).
#     A metric that does not exist and a metric that is zero look identical downstream.
# TR: Uygulama bölünürken (07'de redirect/api) kolayca kaybolurlar ve kayıpları sessizdir.
#     `promq`, serisi olmayan bir sorguya "0" döndürür; dolayısıyla "kaç DB bağlantısı var?" ya
#     da "Redis ne yapıyor?" diye soran her script sıfır ölçüp "sorun yok" der (P07-02
#     max_connections=0 basar).
#     Var olmayan bir metrik ile sıfır olan bir metrik, aşağı akışta AYNI görünür.
#     Kural: bir metriğin varlığını doğrulamadan ona dayanan bir karar verme (`prom_absent`).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  endpoints:
    - port: metrics
      interval: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redpanda
  labels:
    app.kubernetes.io/name: redpanda
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  endpoints:
    - port: admin
      path: /public_metrics
      interval: 10s
