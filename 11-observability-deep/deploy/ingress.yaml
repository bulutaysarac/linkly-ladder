# Tek host, iki servis: yol tabanlı yönlendirme.
# EN: The split is invisible from outside — same URL space, same contract (docs/API.md). That is
#     the point: a service boundary is an internal decision, not an API change. If splitting
#     services forced clients to change, the boundary was drawn in the wrong place.
# TR: Ayrım dışarıdan GÖRÜNMEZ — aynı URL uzayı, aynı sözleşme (docs/API.md). Mesele de bu:
#     servis sınırı içeriye ait bir karardır, bir API değişikliği değil. Servisleri ayırmak
#     client'ları değiştirmeye zorluyorsa, sınır yanlış yere çizilmiştir.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linkly
  annotations:
    # İLK savunma hattı ingress'te. Uygulamaya hiç ulaşmayan istek, en ucuz reddedilen istektir —
    # ama ingress yalnızca kaba bir ağ (IP başına) kurabilir: kiracı, API anahtarı ya da uç
    # maliyeti hakkında hiçbir şey bilmez. Bu yüzden İKİ katman: kaba filtre burada, ince
    # karar uygulamada. Tek katmana güvenmek, ya çok gevşek ya çok sıkı olmak demektir.
    nginx.ingress.kubernetes.io/limit-rps: "400"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    # X-Forwarded-For'a gerçek client adresini ekle (uygulama sağdan TRUSTED_PROXY_HOPS kadar okur)
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: lvl11.localtest.me
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: api, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: redirect, port: { name: http } } }
