# Redis 7 — paylaşılan L2 önbellek. BİLEREK tek kopya ve sınırlı bellek.
# EN: One replica so its death is measurable (P04-01), a small maxmemory so the eviction policy
#     matters (P04-06), and `noeviction` on purpose: the default that surprises people. With
#     noeviction a full cache stops accepting WRITES and starts returning OOM errors — the cache
#     silently stops caching while still looking present.
# TR: Ölümü ölçülebilsin diye tek kopya (P04-01), tahliye politikası önemli olsun diye küçük bir
#     maxmemory (P04-06) ve bilerek `noeviction`: insanları şaşırtan varsayılan. noeviction ile
#     dolan bir önbellek YAZMAYI reddeder ve OOM hatası döndürür — önbellek, hâlâ oradaymış gibi
#     görünürken sessizce önbelleklemeyi bırakır.
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
    - name: metrics
      port: 9121
      targetPort: metrics
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  serviceName: redis
  replicas: 1          # P04-01: tek kopya, failover yok. 14'te Sentinel/Valkey HA.
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --maxmemory
            - 64mb                    # P04-06: küçük tutuldu ki dolması ölçülebilsin
            - --maxmemory-policy
            - noeviction              # P04-06: BİLEREK. allkeys-lru olsaydı sessizce eskiyi atardı.
            - --save
            - ""                      # kalıcılık YOK: bu bir önbellek, veritabanı değil
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests: { cpu: 100m, memory: 96Mi }
            limits: { memory: 192Mi }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 6
        - name: exporter
          image: oliver006/redis_exporter:v1.62.0
          ports:
            - name: metrics
              containerPort: 9121
          env:
            - name: REDIS_ADDR
              value: redis://127.0.0.1:6379
          # Sidecar'ın da readiness'i olmalı: exporter ölürse pod "hazır" görünmeye devam eder
          # ve metrik akışı sessizce durur. (13'ün require-probes politikası bunu zorunlu kılar.)
          # EN: A sidecar needs readiness too — if the exporter dies the pod still reports Ready
          # and the metrics simply stop, silently. Level 13's require-probes policy enforces this.
          readinessProbe:
            httpGet: { path: /health, port: metrics }
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 96Mi }
