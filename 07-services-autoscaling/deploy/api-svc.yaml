# api-svc — yönetim yolu. Az replika, BÜYÜK havuz, HPA yok (trafiği öngörülebilir).
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: { app.kubernetes.io/name: api }
spec:
  selector: { app.kubernetes.io/name: api }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app.kubernetes.io/name: api }
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: api }
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: api
          image: localhost:5001/linkly-ladder/07-api-svc:IMAGE_TAG
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ secretRef: { name: postgres } }]
          env:
            - { name: SERVICE_NAME, value: api }
            - { name: REDIS_ADDR, value: "redis:6379" }
            - { name: KAFKA_BROKERS, value: "redpanda:9092" }
            # redirect'in TAM TERSİ: az pod, çok bağlantı. Yazma ve liste sorguları DB'ye gider.
            - { name: DB_MAX_CONNS, value: "15" }
            - { name: SHUTDOWN_GRACE, value: "20s" }
            # TRAP'ler kapalı: TRAP_LIST_N_PLUS_ONE · TRAP_READY_ALWAYS
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 256Mi }   # CPU limiti YOK: burst'e izin ver, throttling'i redirect'te ölç
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          lifecycle: { preStop: { sleep: { seconds: 5 } } }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api
  labels: { app.kubernetes.io/name: api }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: api }
  endpoints: [{ port: http, path: /metrics, interval: 10s }]
