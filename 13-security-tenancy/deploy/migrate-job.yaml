# Şema değişikliği TEK SEFERLİK bir iş, uygulamanın açılış rutini değil.
# EN: If every pod runs migrations on boot, N replicas race for the same schema lock: some block,
#     some fail, the rollout flaps. Worse, a rollback of the app does not roll back the schema.
#     A Job makes the migration an explicit, once, observable step. P02-07 measures the alternative
#     (TRAP_MIGRATE_IN_MAIN), and level 12 shows expand/contract for changes that cannot be atomic.
# TR: Her pod açılışta migration koşarsa, N replika aynı şema kilidi için yarışır: kimi bloklanır,
#     kimi patlar, rollout çırpınır. Dahası uygulamayı geri almak şemayı geri almaz. Job, migration'ı
#     açık, tek seferlik ve gözlemlenebilir bir adım yapar. P02-07 alternatifini ölçüyor
#     (TRAP_MIGRATE_IN_MAIN), 12 ise atomik olamayan değişiklikler için expand/contract'ı gösteriyor.
# [Topic · Konu: Şema göçü, dağıtım sırası]
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  annotations:
    # Her apply'da yeniden koşsun diye Job adı sabit; değişiklik olduğunda silip yeniden yaratılır.
    ladder/note: "kubectl -n lvl13 delete job migrate  →  make up ile yeniden koşar"
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: localhost:5001/linkly-ladder/13-migrate:IMAGE_TAG
          envFrom:
            - secretRef:
                name: postgres
          env:
            # 3 = clicks_daily tablosu (05). Bu seviyede ŞART: analitik yazıcısı ona yazıyor.
            # (2 = tenant index'i, P02-05'in çözümü — burada da uygulanmış oluyor.)
            - name: MIGRATE_TARGET
              # 6 = expand aşaması. RLS (007) BİLEREK UYGULANMIYOR.
              # EN: enabling RLS on `links` requires the application to declare a tenant to the
              #     database on every transaction (SET LOCAL app.tenant_id). This app does not,
              #     and the public redirect path has no tenant at all — a short code is resolved
              #     for anyone. Applying 007 by default therefore would not "harden" the level, it
              #     would stop every write with SQLSTATE 42501 and the level could not boot.
              #     So RLS is applied BY THE EXPERIMENT (P13-02), which measures both what it
              #     protects and what it costs. A defence you cannot turn on is not a defence.
              # TR: `links` üzerinde RLS'i açmak, uygulamanın HER İŞLEMDE veritabanına kiracıyı
              #     bildirmesini gerektirir (SET LOCAL app.tenant_id). Bu uygulama bunu yapmıyor
              #     ve PUBLIC yönlendirme yolunun kiracısı zaten YOK — kısa kod herkes için
              #     çözülür. 007'yi varsayılan olarak uygulamak seviyeyi "sertleştirmez",
              #     her yazmayı SQLSTATE 42501 ile durdurur ve seviye hiç açılamaz.
              #     Bu yüzden RLS'i DENEY (P13-02) uyguluyor: hem neyi koruduğunu hem de neye
              #     mal olduğunu ölçüyor. Açamadığın bir savunma, savunma değildir.
              # Kırıcı rename (`links.url` → `url_old`) de sırada YOK: o bir migration değil bir
              # DENEYDİR — P12-02 onu doğrudan psql ile uygular ve deney bitince geri alır.
              # Sırada olsaydı goose onu da uygular ve seviyenin KENDİ migration'ı kendi
              # uygulamasını bozardı ("column url does not exist", her yazma 503). Sıraya
              # konmuş bir deney, deney olmaktan çıkıp herkesin ödediği bir bedele dönüşür.
              value: "6"
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
