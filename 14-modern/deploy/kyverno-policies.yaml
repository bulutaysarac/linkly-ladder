# KAPSAM NOTU (merdivene özel):
# EN: These rules are deliberately scoped to this level's own namespace. A ClusterPolicy is
#     cluster scoped and survives `make down` (which only deletes the namespace). Scoped to
#     "lvl*" with Enforce, it would silently block EVERY earlier level from starting again —
#     level 00 has no memory limit on purpose (P00-08), so the ladder would lock itself out.
#     That is the real lesson about policy as code: its blast radius is the whole cluster and
#     it outlives the thing that installed it. In production you want "lvl*"; here you want to
#     still be able to run level 00 tomorrow.
# TR: Bu kurallar bilerek YALNIZCA bu seviyenin namespace'ine kapsanmıştır. ClusterPolicy küme
#     kapsamlıdır ve `make down` (yalnızca namespace'i siler) sonrası AYAKTA KALIR. "lvl*" +
#     Enforce olsaydı, geçmişteki her seviyenin yeniden ayağa kalkmasını sessizce engellerdi —
#     00 seviyesinde bellek limiti BİLEREK yok (P00-08), yani merdiven kendi kendini kilitlerdi.
#     Policy-as-code hakkındaki asıl ders bu: etki alanı tüm kümedir ve onu kuran şeyden daha
#     uzun yaşar. Üretimde "lvl*" istersin; burada yarın 00'ı da koşabilmek istiyorsun.
# Kyverno — kuralları YAZIYA değil, KAPIYA dönüştür.
#
# EN: Every rule in this file is something an earlier level learned the hard way and then wrote
#     in a README. A README is a hope; an admission policy is a guarantee. The difference shows
#     up on the day someone who never read that README deploys something.
# TR: Bu dosyadaki her kural, önceki bir seviyenin zor yoldan öğrenip README'ye yazdığı bir şey.
#     README bir temennidir; kabul politikası bir garantidir. Fark, o README'yi hiç okumamış
#     birinin bir şey dağıttığı gün ortaya çıkar.
# [Topic · Konu: Policy as code, admission control]
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: linkly-ladder-baseline
  annotations:
    # Açıklama yalnızca AŞAĞIDAKİ ÜÇ kuralı sayar. "Root olarak çalışma yasak" bir kural DEĞİL —
    # runAsNonRoot pod tanımında duruyor (P13-08) ama admission'da zorunlu değil. Var olmayan bir
    # kuralı ilan eden politika açıklaması, README'den de kötüdür: kapının kendisi yalan söyler.
    # EN: the description lists exactly the three rules below and nothing else; a description
    #     that announces a rule the policy does not enforce makes the gate itself lie.
    policies.kyverno.io/description: >-
      Merdivende öğrenilen kurallar: :latest yasak (P12-04), bellek limiti zorunlu (P00-08),
      probe zorunlu (P00-04/P07-08). Root olarak çalışma bir KURAL DEĞİL: runAsNonRoot pod
      tanımında (P13-08), admission'da zorunlu tutulmuyor.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-latest-tag
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["lvl14"]
      validate:
        message: ":latest etiketi yasak — sürüm belirsiz ve geri alınamaz olur (P12-04)"
        pattern:
          spec:
            containers:
              - image: "!*:latest"
    - name: require-memory-limit
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["lvl14"]
      exclude:
        any:
          # Operatörün yarattığı pod'lar (CNPG bootstrap/instance) bu kuralın dışında: onların
          # kaynak ayarını Cluster manifest'i belirler, pod şablonunu sen yazmıyorsun.
          - resources:
              kinds: [Pod]
              selector:
                matchExpressions:
                  - { key: cnpg.io/cluster, operator: Exists }
          - resources:
              kinds: [Pod]
              selector:
                matchExpressions:
                  - { key: cnpg.io/poolerName, operator: Exists }
      validate:
        message: "Bellek limiti zorunlu — limitsiz bir konteyner node'u düşürebilir (P00-08)"
        pattern:
          spec:
            containers:
              - resources:
                  limits:
                    memory: "?*"
    - name: require-probes
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["lvl14"]
      exclude:
        any:
          - resources:
              kinds: [Pod]
              selector:
                matchLabels:
                  app.kubernetes.io/name: migrate     # Job'ın readiness'i olmaz
          # OPERATÖRÜN KENDİ POD'LARINI DIŞARIDA BIRAK.
          # EN: Without these exclusions the rule blocks CloudNativePG's own `pg-1-initdb`
          #     bootstrap Job — a one-shot pod that legitimately has no readiness probe — so the
          #     level's security policy would keep the level's own database from ever starting.
          #     The policy would do exactly what it says, and that is the problem: a cluster-wide
          #     rule must carve out the controllers that create pods you do not author.
          #     Otherwise "secure" means "does not run".
          # TR: Bu istisnalar olmadan kural CloudNativePG'nin kendi `pg-1-initdb` bootstrap Job'ını
          #     engeller — readiness'i olmayan tek seferlik bir pod — ve seviyenin güvenlik
          #     politikası, seviyenin KENDİ veritabanının açılmasını imkânsız kılar. Politika tam
          #     da yazdığı şeyi yapar; sorun da budur: küme geneli bir kural, senin yazmadığın
          #     pod'ları yaratan denetleyicileri dışarıda bırakmalı. Yoksa "güvenli", "çalışmıyor"
          #     demektir.
          - resources:
              kinds: [Pod]
              selector:
                matchExpressions:
                  - { key: cnpg.io/cluster, operator: Exists }
          - resources:
              kinds: [Pod]
              selector:
                matchExpressions:
                  - { key: cnpg.io/podRole, operator: Exists }
          - resources:
              kinds: [Pod]
              selector:
                matchExpressions:
                  - { key: cnpg.io/poolerName, operator: Exists }
          - resources:
              kinds: [Pod]
              selector:
                matchLabels:
                  app.kubernetes.io/name: topics      # tek seferlik topic oluşturma Job'ı
      validate:
        message: "readinessProbe zorunlu — probe'suz pod hazır olmadan trafik alır (P00-04, P07-08)"
        # DESEN TUZAĞI · PATTERN PITFALL
        # EN: The obvious pattern, `readinessProbe: {"?*": "?*"}`, reads as "any key, any value",
        #     but Kyverno applies the value wildcard to each key's value, and `httpGet` is a MAP,
        #     not a scalar — so it rejects pods that DO have a probe, with a message that says
        #     the opposite of what is wrong. A policy that lies about why it denied you is worse
        #     than no policy.
        #     `periodSeconds: ">0"` is safe: the API server defaults it for every probe kind
        #     (httpGet, exec, tcpSocket), so its presence proves a probe exists.
        # TR: Akla ilk gelen desen, `readinessProbe: {"?*": "?*"}`, "her anahtar, her değer"
        #     gibi okunuyor ama Kyverno değer joker'ini her anahtarın DEĞERİNE uyguluyor ve
        #     `httpGet` skaler değil MAP — yani probe'u OLAN pod'ları, asıl sorunun tam tersini
        #     söyleyen bir mesajla reddeder. Reddetme sebebi hakkında yalan söyleyen bir politika,
        #     politikasızlıktan kötüdür.
        #     `periodSeconds: ">0"` güvenli: API sunucusu bunu her probe türü için (httpGet,
        #     exec, tcpSocket) varsayılan olarak doldurur — varlığı probe'un varlığını kanıtlar.
        pattern:
          spec:
            containers:
              - readinessProbe:
                  periodSeconds: ">0"
