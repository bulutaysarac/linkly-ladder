# KAPSAM NOTU (merdivene özel):
# EN: These rules are deliberately scoped to this level's own namespace. A ClusterPolicy is
#     cluster scoped and survives `make down` (which only deletes the namespace). Scoped to
#     "lvl*" with Enforce, it would silently block EVERY earlier level from starting again —
#     level 00 has no memory limit on purpose (P00-08), so the ladder would lock itself out.
#     That is the real lesson about policy as code: its blast radius is the whole cluster and
#     it outlives the thing that installed it. In production you want "lvl*"; here you want to
#     still be able to run level 00 tomorrow.
# TR: Bu kurallar bilerek YALNIZCA bu seviyenin namespace'ine kapsanmıştır. ClusterPolicy küme
#     kapsamlıdır ve `make down` (yalnızca namespace'i siler) sonrası AYAKTA KALIR. "lvl*" +
#     Enforce olsaydı, geçmişteki her seviyenin yeniden ayağa kalkmasını sessizce engellerdi —
#     00 seviyesinde bellek limiti BİLEREK yok (P00-08), yani merdiven kendi kendini kilitlerdi.
#     Policy-as-code hakkındaki asıl ders bu: etki alanı tüm kümedir ve onu kuran şeyden daha
#     uzun yaşar. Üretimde "lvl*" istersin; burada yarın 00'ı da koşabilmek istiyorsun.
# Kyverno — kuralları YAZIYA değil, KAPIYA dönüştür.
#
# EN: Every rule in this file is something an earlier level learned the hard way and then wrote
#     in a README. A README is a hope; an admission policy is a guarantee. The difference shows
#     up on the day someone who never read that README deploys something.
# TR: Bu dosyadaki her kural, önceki bir seviyenin zor yoldan öğrenip README'ye yazdığı bir şey.
#     README bir temennidir; kabul politikası bir garantidir. Fark, o README'yi hiç okumamış
#     birinin bir şey dağıttığı gün ortaya çıkar.
# [Topic · Konu: Policy as code, admission control]
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: linkly-ladder-baseline
  annotations:
    policies.kyverno.io/description: >-
      Merdivende öğrenilen kurallar: :latest yasak (P12-04), bellek limiti zorunlu (P00-08),
      probe zorunlu (P00-04/P07-08), root olarak çalışma yasak.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-latest-tag
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["lvl14"]
      validate:
        message: ":latest etiketi yasak — sürüm belirsiz ve geri alınamaz olur (P12-04)"
        pattern:
          spec:
            containers:
              - image: "!*:latest"
    - name: require-memory-limit
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["lvl14"]
      exclude:
        any:
          # Operatörün yarattığı pod'lar (CNPG bootstrap/instance) bu kuralın dışında: onların
          # kaynak ayarını Cluster manifest'i belirler, pod şablonunu sen yazmıyorsun.
          - resources:
              kinds: [Pod]
              selector:
                matchExpressions:
                  - { key: cnpg.io/cluster, operator: Exists }
      validate:
        message: "Bellek limiti zorunlu — limitsiz bir konteyner node'u düşürebilir (P00-08)"
        pattern:
          spec:
            containers:
              - resources:
                  limits:
                    memory: "?*"
    - name: require-probes
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["lvl14"]
      exclude:
        any:
          - resources:
              kinds: [Pod]
              selector:
                matchLabels:
                  app.kubernetes.io/name: migrate     # Job'ın readiness'i olmaz
          # OPERATÖRÜN KENDİ POD'LARINI DIŞARIDA BIRAK.
          # EN: This rule blocked CloudNativePG's own `pg-1-initdb` bootstrap Job — a one-shot pod
          #     that legitimately has no readiness probe — so the level's security policy prevented
          #     the level's own database from ever starting. The policy did exactly what it said
          #     and that was the problem: a cluster-wide rule must carve out the controllers that
          #     create pods you do not author. Otherwise "secure" means "does not run".
          # TR: Bu kural CloudNativePG'nin kendi `pg-1-initdb` bootstrap Job'ını engelledi —
          #     readiness'i olmayan tek seferlik bir pod — ve seviyenin güvenlik politikası,
          #     seviyenin KENDİ veritabanının açılmasını imkânsız kıldı. Politika tam da yazdığı
          #     şeyi yaptı; sorun da buydu: küme geneli bir kural, senin yazmadığın pod'ları
          #     yaratan denetleyicileri dışarıda bırakmalı. Yoksa "güvenli", "çalışmıyor" demektir.
          - resources:
              kinds: [Pod]
              selector:
                matchExpressions:
                  - { key: cnpg.io/cluster, operator: Exists }
          - resources:
              kinds: [Pod]
              selector:
                matchExpressions:
                  - { key: cnpg.io/podRole, operator: Exists }
          - resources:
              kinds: [Pod]
              selector:
                matchLabels:
                  app.kubernetes.io/name: topics      # tek seferlik topic oluşturma Job'ı
      validate:
        message: "readinessProbe zorunlu — probe'suz pod hazır olmadan trafik alır (P00-04, P07-08)"
        pattern:
          spec:
            containers:
              - readinessProbe:
                  "?*": "?*"
