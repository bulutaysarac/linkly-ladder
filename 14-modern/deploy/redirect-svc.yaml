# redirect Service + ServiceMonitor. Deployment yerine Rollout kullanıldığı için ayrıldı.
apiVersion: v1
kind: Service
metadata:
  name: redirect
  labels: { app.kubernetes.io/name: redirect }
spec:
  selector: { app.kubernetes.io/name: redirect }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redirect
  labels: { app.kubernetes.io/name: redirect }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: redirect }
  # SÜRÜM ETİKETİ: Argo Rollouts her sürümün pod'larına farklı bir `rollouts-pod-template-hash`
  # verir; bunu her seriye taşımak "stable vs canary" panellerini mümkün kılar. Uygulama metriklerinde
  # sürüm etiketi YOK; bu etiket olmadan 13 · Rollout'un "sürüme göre" panelleri tek çizgi çizerdi.
  # EN: carry the Rollout's per-version pod label onto every series so canary and stable separate.
  podTargetLabels: [rollouts-pod-template-hash]
  endpoints: [{ port: http, path: /metrics, interval: 10s }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redirect
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redirect }
