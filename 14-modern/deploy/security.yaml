# NetworkPolicy: varsayılan REDDET + açık izin listesi.
#
# EN: Until now every pod could reach every other pod, including Postgres and Redis. That is the
#     default in Kubernetes and it is the opposite of least privilege: a compromised sidecar, a
#     debug container or a misconfigured job can talk to the database directly. Default-deny
#     flips the question from "what should I block?" (endless, you always miss one) to "what must
#     talk to what?" (finite, reviewable, and it documents your architecture).
# TR: Şimdiye kadar her pod her pod'a ulaşabiliyordu, Postgres ve Redis dahil. Kubernetes'in
#     varsayılanı budur ve en az yetkinin tam tersidir: ele geçirilmiş bir sidecar, bir debug
#     konteyneri ya da yanlış yapılandırılmış bir job doğrudan veritabanıyla konuşabilir.
#     Varsayılan-reddet, soruyu "neyi engellemeliyim?"den (sonsuz, hep birini kaçırırsın)
#     "ne neyle konuşmalı?"ya (sonlu, gözden geçirilebilir ve mimariyi BELGELER) çevirir.
# [Topic · Konu: NetworkPolicy, en az yetki]
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-services
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [redirect, api]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }   # Prometheus scrape
      ports:
        - { protocol: TCP, port: 8080 }
---
# Postgres'e YALNIZCA uygulama servisleri ve pooler erişebilir.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-from-apps
spec:
  podSelector:
    matchLabels: { cnpg.io/cluster: pg }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [redirect, api, analytics, migrate]
        - podSelector:
            matchLabels: { cnpg.io/cluster: pg }        # replikasyon
        - podSelector:
            matchLabels: { cnpg.io/poolerName: pg-pooler-rw }
        - podSelector:
            matchLabels: { cnpg.io/poolerName: pg-pooler-ro }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: cnpg-system }  # operatör
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-from-apps
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: redis }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [redirect, api]
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redpanda-from-apps
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: redpanda }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                # topics: tek seferlik Job. Listede olmasa Job "cluster health" çağrısında zaman
                # aşımına uğrar — varsayılan-reddet, topic'leri yaratan işi de keser ve tüketici
                # boş bir broker'ı dinler. Varsayılan-reddetin bedeli budur: listeye girmeyen HER
                # ŞEY sessizce kopar, hata mesajı da "timeout" der.
                # EN: `topics` is a one-shot Job. Left off this list, it times out on `cluster
                # health` — default-deny cuts the very job that creates the topics. That is the
                # cost of default-deny: anything not on the list breaks silently, and the error
                # you get says "timeout", not "policy".
                values: [redirect, api, analytics, topics]
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: keda }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
---
# Prometheus KAZIMASI: varsayılan-reddetin ilk kurbanı gözlemlenebilirliktir.
# EN: default-deny also blocks the scraper. `analytics` receives no user traffic, so it is easy
#     to leave it off the allow-list — and then its metrics silently vanish, which means every
#     measurement script on this level reads 0 and reports "no problem". A blind level looks
#     like a healthy level. Allow the monitoring namespace to reach every pod, explicitly.
# TR: varsayılan-reddet kazıyıcıyı da keser. `analytics` kullanıcı trafiği almaz, bu yüzden izin
#     listesinde unutulması kolaydır — ve metrikleri sessizce kaybolur, yani bu seviyedeki her
#     ölçüm scripti 0 okur ve "sorun yok" der. KÖR bir seviye, SAĞLIKLI bir seviye gibi görünür.
#     monitoring namespace'ine her pod'a erişim iznini AÇIKÇA ver.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-scrape
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
        # Node ağı: kubelet probe'ları ve API sunucusunun pod proxy'si (ölçüm scriptleri
        # /metrics'i bu yoldan 1 sn'lik çözünürlükle örnekliyor). Bunlar pod DEĞİL, bu yüzden
        # podSelector ile ifade edilemez — kaynak IP ile izin vermek zorundasın.
        # EN: The node network: kubelet probes and the API server's pod proxy (the measurement
        # scripts sample /metrics through it at 1s resolution). These are not pods, so you
        # cannot express them with a podSelector — you must allow them by source IP.
        - ipBlock:
            cidr: 172.19.0.0/16
---
# PgBouncer havuzları da ayrı pod'lardır: uygulama Postgres'e DOĞRUDAN değil, buradan bağlanır.
# EN: The poolers are separate pods. Allowing "apps → postgres" is not enough when the apps
#     actually connect to the pooler; the connection string points at pg-pooler-rw.
# TR: Havuzlar ayrı pod'lardır. Uygulamalar aslında havuza bağlandığı için "uygulama → postgres"
#     izni yetmez; bağlantı dizesi pg-pooler-rw'yi gösterir.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pooler-from-apps
spec:
  podSelector:
    matchExpressions:
      - key: cnpg.io/poolerName
        operator: Exists
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [redirect, api, analytics, migrate]
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: cnpg-system }
