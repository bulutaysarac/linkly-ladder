# Redpanda — Kafka API uyumlu, tek binary. BİLEREK tek broker ve TEK PARTITION.
# EN: One broker so its loss is measurable (P06-05), one partition so the consumer-parallelism
#     ceiling is measurable (P06-03). Both are wrong for production and right for learning:
#     you cannot feel why partitions matter until scaling consumers changes nothing.
# TR: Kaybı ölçülebilsin diye tek broker (P06-05), tüketici paralellik tavanı ölçülebilsin diye
#     tek partition (P06-03). İkisi de üretim için yanlış, öğrenmek için doğru: tüketiciyi
#     çoğaltmanın hiçbir şeyi değiştirmediğini görmeden partition'ların neden önemli olduğunu
#     hissedemezsin.
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  labels:
    app.kubernetes.io/name: redpanda
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
    - name: admin
      port: 9644
      targetPort: admin
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  labels:
    app.kubernetes.io/name: redpanda
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.2.7
          args:
            - redpanda
            - start
            - --smp=1
            - --memory=700M
            - --reserve-memory=0M
            - --overprovisioned
            - --node-id=0
            - --check=false
            - --kafka-addr=PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr=PLAINTEXT://redpanda.$(POD_NAMESPACE).svc.cluster.local:9092
            - --rpc-addr=0.0.0.0:33145
            - --advertise-rpc-addr=$(POD_NAME).redpanda.$(POD_NAMESPACE).svc.cluster.local:33145
            # 14: partition sayısı 3 — P06-03'teki tüketici paralellik tavanı kalktı.
            # Bedeli: global sıra YOK, yalnızca partition başına sıra (anahtar = kısa kod).
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          # Topic'leri AÇIKÇA oluştur (hiçbir `--set redpanda.*` bayrağı KULLANMIYORUZ).
          # EN: `--set redpanda.default_topic_*` are CLUSTER properties, not node flags; this
          #     redpanda build rejects the unknown argument and the broker never starts. It
          #     crash-looped silently while every stream experiment "measured" a dead broker
          #     (P06-05 reported 75k producer errors and we read it as a feature).
          #     Creating the topic explicitly states the intent instead of relying on defaults.
          # TR: `--set redpanda.default_topic_*` bir KÜME özelliğidir, düğüm bayrağı değil; bu
          #     redpanda sürümü tanımadığı argümanla açılmıyor. Broker sessizce crash-loop'ta
          #     kaldı ve bütün stream deneyleri ÖLÜ bir broker'ı "ölçtü" (P06-05'in 75 bin
          #     üretici hatası aslında buydu). Topic'i açıkça oluşturmak, varsayılana güvenmek
          #     yerine NİYETİ yazmaktır — ve partition sayısı zaten bir tasarım kararı (P06-03).
#     NOT: bu sürüm `--set redpanda.*` bayraklarının HİÇBİRİNİ kabul etmiyor
#     (auto_create_topics_enabled dahil); küme özellikleri `rpk cluster config` ile ayarlanır.
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # Küme sağlıklı olana kadar bekle (ilk açılış saniyeler sürüyor).
                    for i in $(seq 1 150); do rpk cluster health >/dev/null 2>&1 && break; sleep 2; done
                    # `--set redpanda.*` bayrakları bu sürümde YOK; küme özellikleri böyle ayarlanır.
                    rpk cluster config set auto_create_topics_enabled true >/dev/null 2>&1 || true
                    # Oluşturmayı da YENİDEN DENE: tek seferlik `|| true`, hatayı yutar ve
                    # topic'siz bir broker'la devam edersin (ilk hâlde tam olarak bu oldu).
                    for i in $(seq 1 30); do rpk topic create clicks -p 3 -r 1 >/dev/null 2>&1 && break; sleep 2; done
                    for i in $(seq 1 30); do rpk topic create clicks-dlq -p 1 -r 1 >/dev/null 2>&1 && break; sleep 2; done
                    exit 0
          ports:
            - name: kafka
              containerPort: 9092
            - name: admin
              containerPort: 9644
          resources:
            requests: { cpu: 300m, memory: 768Mi }
            limits: { memory: 1400Mi }
          readinessProbe:
            httpGet: { path: /v1/status/ready, port: admin }
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /v1/status/ready, port: admin }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 4Gi
