# Grafana / Prometheus / Alertmanager'a port-forward'sız erişim: *.localtest.me → 127.0.0.1
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: monitoring
spec:
  ingressClassName: nginx
  rules:
    - host: prometheus.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: kps-kube-prometheus-stack-prometheus, port: { number: 9090 } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  ingressClassName: nginx
  rules:
    - host: alertmanager.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: kps-kube-prometheus-stack-alertmanager, port: { number: 9093 } } }
