# Loki ve Alloy'un KENDİ metriklerini Prometheus'a aldır.
#
# EN: The observability stack is a system too, and it has capacity. P11-05 asks "what happens to
#     your logs when you turn on debug logging during an incident?" — a question you cannot answer
#     unless Loki's own ingestion and discard counters are in Prometheus. Without these two
#     ServiceMonitors the script silently measures zero and reports "no problem".
# TR: Gözlemlenebilirlik yığını da bir sistemdir ve kapasitesi vardır. P11-05 "olay sırasında debug
#     log açarsan loglarına ne olur?" diye sorar — Loki'nin kendi alım ve düşürme sayaçları
#     Prometheus'ta olmadan bu sorunun cevabı yoktur. Bu iki ServiceMonitor olmadan script sessizce
#     sıfır ölçer ve "sorun yok" der.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: loki
  namespace: monitoring
  labels:
    release: kps            # kube-prometheus-stack yalnızca bu etiketli ServiceMonitor'ları alır
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/instance: loki
    # headless servis AYNI etiketleri taşıyor; ikisi de seçilirse her hedef İKİ KEZ scrape edilir
    # ve sayaçlar iki katına çıkar. Chart bunun için `prometheus.io/service-monitor: "false"` koyuyor.
    matchExpressions:
      - { key: prometheus.io/service-monitor, operator: NotIn, values: ["false"] }
  namespaceSelector:
    matchNames: ["monitoring"]
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: alloy
  namespace: monitoring
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
      app.kubernetes.io/instance: alloy
  namespaceSelector:
    matchNames: ["monitoring"]
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 15s
---
# Kyverno'nun KENDİ metrikleri — panel vardı, veri yoktu.
#
# EN: level 13's dashboard has a "Kyverno policy results" panel and P13-07 points the reader at
#     it. Kyverno exposes `kyverno_policy_results_total` on its metrics Service, but nothing
#     scraped it, so the panel was permanently empty. A panel that is always empty is worse than
#     a missing panel: the reader concludes "no policy violations" instead of "no data".
#     Same failure shape as Loki/Alloy above — the tool ships metrics, the cluster just never
#     asked for them.
# TR: 13'ün dashboard'unda "Kyverno policy sonuçları" paneli var ve P13-07 okuyucuyu oraya
#     yönlendiriyor. Kyverno `kyverno_policy_results_total`'ı metrik Service'inde yayınlıyor ama
#     kimse kazımıyordu, yani panel kalıcı olarak boştu. HER ZAMAN boş olan bir panel, olmayan
#     bir panelden kötüdür: okuyucu "ihlal yok" diye okur, "veri yok" diye değil.
#     Yukarıdaki Loki/Alloy ile aynı arıza biçimi — araç metrik üretiyor, küme hiç sormuyor.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kyverno
  namespace: monitoring
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: kyverno
  namespaceSelector:
    matchNames: ["kyverno"]
  endpoints:
    - port: metrics-port
      path: /metrics
      interval: 30s
