# target: app.kubernetes.io/name=redpanda
# YARIŞIN PENCERESİ, ONU BESLEYEN İŞLEMİN SÜRESİDİR — ve doğru işlemi seçmek gerekir.
#
# EN: P06-01 needs the consumer to die AFTER the database write committed but BEFORE the Kafka
#     offset commit landed. Its first version delayed POSTGRES (pg-delay-2s), which widens the
#     window *before* the write: kill there and the transaction rolls back, nothing was applied,
#     the redelivery applies it for the first time and there is no duplicate to observe. The
#     window that matters is the offset commit, so the thing to slow down is the BROKER.
#     Picking the wrong process to slow down produces a perfectly executed experiment that
#     cannot possibly show the effect.
# TR: P06-01, tüketicinin veritabanı yazması COMMIT OLDUKTAN SONRA ama Kafka offset commit'i
#     YERLEŞMEDEN ölmesini ister. İlk hâli POSTGRES'i geciktiriyordu (pg-delay-2s); o, pencereyi
#     yazmanın ÖNCESİNDE genişletir: orada öldürürsen işlem geri alınır, hiçbir şey uygulanmamıştır,
#     tekrar teslim onu İLK KEZ uygular ve gözlenecek bir duplicate olmaz. Önemli olan pencere
#     offset commit'idir, yani yavaşlatılacak şey BROKER'dır.
#     Yavaşlatılacak yanlış süreci seçmek, kusursuz koşan ama etkiyi GÖSTEREMEYEN bir deney üretir.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata: { name: redpanda-delay-2s, namespace: ${NS} }
spec:
  action: delay
  mode: all
  selector: { namespaces: ["${NS}"], labelSelectors: { app.kubernetes.io/name: redpanda } }
  delay: { latency: "2s", jitter: "200ms" }
  direction: to
