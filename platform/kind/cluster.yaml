# kind cluster — 1 control-plane + 3 worker. Çoklu node: drain / node-freeze deneyleri için.
# CNI kapalı → Calico kurulur (13'te NetworkPolicy için cluster'ı yeniden kurmamak).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: linkly   # platform/Makefile KIND_NAME ile aynı olmalı
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
      # LİDER KİRASI BU VM'E GÖRE. Varsayılan kira 15 sn / yenileme 10 sn. 6 çekirdeği dört düğüm
      # paylaşırken yük üreteci, derleme ya da `make up`'ın docker build'i API sunucusunu aç
      # bırakıyor ve lease yazması 25 sn'ye çıkıyor: controller-manager 173, scheduler 163 kez
      # kirayı kaybedip yeniden başladı. Yeniden başlayan her controller her şeyi baştan
      # listeliyor, API sunucusunu daha da yavaşlatıyor ve sıradakini düşürüyor — bir GERİ
      # BESLEME DÖNGÜSÜ. Scheduler düşükken öldürülen pod'un yerine yenisi konmaz; deney
      # sistemi değil kümeyi ölçer. Operatörlerin (CNPG, Argo Rollouts) aynı ayarı Makefile'da.
      # EN: default lease 15s/renew 10s; on this shared 6-core VM lease writes hit 25s and the
      #     control plane restarted 170+ times, each restart re-listing everything and starving
      #     the API server further. A single-replica control plane gains nothing from fast failover.
      - |
        kind: ClusterConfiguration
        controllerManager:
          extraArgs:
            - { name: leader-elect-lease-duration, value: 60s }
            - { name: leader-elect-renew-deadline, value: 45s }
            - { name: leader-elect-retry-period, value: 5s }
        scheduler:
          extraArgs:
            - { name: leader-elect-lease-duration, value: 60s }
            - { name: leader-elect-renew-deadline, value: 45s }
            - { name: leader-elect-retry-period, value: 5s }
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
  - role: worker
