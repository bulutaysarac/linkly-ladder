# kube-prometheus-stack — Prometheus + Grafana + Alertmanager + KSM + node-exporter. Mac'e göre kısılmış.
fullnameOverride: kps
grafana:
  adminPassword: ladder
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: [grafana.localtest.me]
  defaultDashboardsEnabled: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
      searchNamespace: ALL
    datasources:
      enabled: true
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.monitoring.svc:3100
      access: proxy
      jsonData:
        derivedFields:
          - name: trace_id
            matcherRegex: '"trace_id":"(\w+)"'
            url: '$${__value.raw}'
            datasourceUid: tempo
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.monitoring.svc:3200
      access: proxy
  grafana.ini:
    dashboards:
      min_refresh_interval: 5s
    users:
      default_theme: dark
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
prometheus:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: [prometheus.localtest.me]
  prometheusSpec:
    # ÖLÇÜLDÜ: 6 CPU / 10 GB'lık bu VM'de 15 sn'lik scrape + 2 günlük saklama ile Prometheus
    # tek başına ~880 MB ve %64 CPU yiyor; küme takla atıyor (node'lar NotReady, controller
    # manager lider kiralamasını kaybediyor). Gözlemlenebilirlik yığınının da bir KAPASİTESİ
    # vardır ve o kapasite, gözlediği sistemle aynı bütçeden çıkar — P11-05'in dersi, burada
    # platformun kendisinde. Merdiven kısa deneyler koştuğu için 2 gün saklamaya gerek yok.
    retention: 6h
    scrapeInterval: 30s
    evaluationInterval: 15s
    enableRemoteWriteReceiver: true          # k6 -o experimental-prometheus-rw
    enableFeatures: [exemplar-storage]       # 11: exemplar → Tempo
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # WAL OYNATMA, KARARLI DURUMDAN DAHA FAZLA BELLEK İSTER.
    # Kararlı hâlde ~880 MB yeterliydi ve limit 1536Mi konmuştu. Ama kind control-plane'i sert
    # yeniden başlayınca Prometheus 73 segmentlik WAL'i oynatmak zorunda kaldı ve tam orada
    # OOMKilled oldu; kubelet yeniden başlattı, replay baştan başladı ve SONSUZ bir döngüye
    # girdi. O sırada koşan doğrulama turu Prometheus'a ulaşamadığı için her `promq` 0 döndü:
    # ÖLÇÜM YAPILMADAN sonuç üretiliyordu. Bir bileşenin limitini KARARLI durumuna göre değil,
    # EN KÖTÜ ANINA (kurtarma) göre seç; kurtarma yolu, en çok ihtiyaç duyulan yoldur.
    # EN: steady state fit in 1536Mi, but after a hard control-plane restart Prometheus had to
    # replay a 73-segment WAL and was OOMKilled mid-replay — restart, replay again, forever. The
    # verification sweep running at the time got 0 from every `promq` and produced verdicts with
    # no measurement behind them. Size a limit for the RECOVERY path, not the steady state.
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 3Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources: { requests: { storage: 8Gi } }
alertmanager:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: [alertmanager.localtest.me]
  alertmanagerSpec:
    resources: { requests: { cpu: 10m, memory: 64Mi }, limits: { memory: 128Mi } }
# kind'da bunlar localhost'a bağlı; hedefler kırmızı görünmesin
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
prometheus-node-exporter:
  resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { memory: 128Mi } }
kube-state-metrics:
  resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { memory: 256Mi } }
prometheusOperator:
  resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
