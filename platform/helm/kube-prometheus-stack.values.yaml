# kube-prometheus-stack — Prometheus + Grafana + Alertmanager + KSM + node-exporter. Mac'e göre kısılmış.
fullnameOverride: kps
grafana:
  adminPassword: ladder
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: [grafana.localtest.me]
  defaultDashboardsEnabled: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
      searchNamespace: ALL
    datasources:
      enabled: true
      # EXEMPLAR → TEMPO: 11+ uygulama gecikme histogramına örnek trace kimliği iliştirir; bu bağ olmadan
      # Grafana'da noktaya tıklayıp trace'e gidilemez (11 §8'deki exemplar → trace yolu buna dayanır).
      # EN: link exemplar trace_id to the Tempo datasource so a histogram point opens its trace.
      exemplarTraceIdDestinations:
        datasourceUid: tempo
        traceIdLabelName: trace_id
        urlDisplayLabel: Trace'i aç (Tempo)
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.monitoring.svc:3100
      access: proxy
      jsonData:
        derivedFields:
          - name: trace_id
            matcherRegex: '"trace_id":"(\w+)"'
            url: '$${__value.raw}'
            datasourceUid: tempo
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.monitoring.svc:3200
      access: proxy
  grafana.ini:
    dashboards:
      min_refresh_interval: 5s
    users:
      default_theme: dark
  # BELLEK SINIRI, ÇALIŞMA KÜMESİNİN EPEY ÜSTÜNDE OLMALI — yoksa bedeli CPU olarak ödenir.
  # Chart GOMEMLIMIT'i sınırın %90'ı yapar. Grafana 13 boşta ~390 MiB, paneller açıkken 450-470
  # MiB çalışır. Sınır bu kümeye yakınsa (512 Mi → hedef 460 MiB) Go çöp toplayıcısı durmadan
  # çalışır: Grafana çekirdekler yer, Prometheus 35 ms'de cevap verse de her panel sorgusu
  # saniyeler sürer, 1 sn'lik readiness düşer → 503, liveness düşer → öldürülür (137). OOM hiç
  # görünmez; sınır bellek değil CPU olarak ödenir. 1 Gi, hedefi çalışma kümesinin çok üstüne koyar.
  # EN: GOMEMLIMIT is 90% of the limit. With a limit close to Grafana 13's working set the GC runs
  #     continuously: cores burned, multi-second panel queries, readiness/liveness failures —
  #     never an OOM. 1Gi puts the target well above the working set.
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 1Gi }
prometheus:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: [prometheus.localtest.me]
  prometheusSpec:
    # ÖLÇÜLDÜ: 6 CPU / 10 GB'lık bu VM'de 15 sn'lik scrape + 2 günlük saklama ile Prometheus
    # tek başına ~880 MB ve %64 CPU yiyor; küme takla atıyor (node'lar NotReady, controller
    # manager lider kiralamasını kaybediyor). Gözlemlenebilirlik yığınının da bir KAPASİTESİ
    # vardır ve o kapasite, gözlediği sistemle aynı bütçeden çıkar — P11-05'in dersi, burada
    # platformun kendisinde. Merdiven kısa deneyler koştuğu için 2 gün saklamaya gerek yok.
    retention: 6h
    scrapeInterval: 30s
    evaluationInterval: 15s
    enableRemoteWriteReceiver: true          # k6 -o experimental-prometheus-rw
    enableFeatures: [exemplar-storage]       # 11: exemplar → Tempo
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # WAL OYNATMA, KARARLI DURUMDAN DAHA FAZLA BELLEK İSTER.
    # Kararlı hâlde ~880 MB yeter. Ama kind control-plane'i sert yeniden başlayınca Prometheus
    # onlarca segmentlik WAL'i oynatmak zorundadır; limit kararlı duruma göre (ör. 1536Mi)
    # seçilirse tam orada OOMKilled olur, kubelet yeniden başlatır, replay baştan başlar ve
    # SONSUZ bir döngüye girer. O sırada koşan her deney Prometheus'a ulaşamaz ve `promq` 0 döner:
    # ÖLÇÜM YAPILMADAN sonuç üretilir. Bir bileşenin limitini KARARLI durumuna göre değil,
    # EN KÖTÜ ANINA (kurtarma) göre seç; kurtarma yolu, en çok ihtiyaç duyulan yoldur.
    # EN: steady state fits in ~1.5Gi, but after a hard control-plane restart Prometheus must
    # replay a multi-segment WAL; sized for the steady state it is OOMKilled mid-replay —
    # restart, replay again, forever — and every experiment reads 0 from `promq` with no
    # measurement behind it. Size a limit for the RECOVERY path, not the steady state.
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 3Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources: { requests: { storage: 8Gi } }
alertmanager:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: [alertmanager.localtest.me]
  alertmanagerSpec:
    resources: { requests: { cpu: 10m, memory: 64Mi }, limits: { memory: 128Mi } }
# kind'da bunlar localhost'a bağlı; hedefler kırmızı görünmesin
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
prometheus-node-exporter:
  resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { memory: 128Mi } }
kube-state-metrics:
  resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { memory: 256Mi } }
prometheusOperator:
  resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
