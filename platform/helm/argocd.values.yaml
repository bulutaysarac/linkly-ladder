# Argo CD — laptop ölçeğinde kısılmış. HA yok, Dex yok, Redis HA yok.
global:
  domain: argocd.localtest.me
configs:
  params:
    server.insecure: true   # ingress TLS'siz: localtest.me için sertifika yok (13 §9)
  cm:
    timeout.reconciliation: 30s
server:
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: argocd.localtest.me
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
controller:
  # 13 · Rollout → "Git ile uyumsuz uygulamalar" argocd_app_info'yu okur; metrik + ServiceMonitor olmadan panel boş kalır.
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }
repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
applicationSet:
  enabled: false
notifications:
  enabled: false
dex:
  enabled: false
redis:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 192Mi }
