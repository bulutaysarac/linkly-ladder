# Redpanda — Kafka API uyumlu, tek binary. BİLEREK tek broker ve TEK PARTITION.
# EN: One broker so its loss is measurable (P06-05), one partition so the consumer-parallelism
#     ceiling is measurable (P06-03). Both are wrong for production and right for learning:
#     you cannot feel why partitions matter until scaling consumers changes nothing.
# TR: Kaybı ölçülebilsin diye tek broker (P06-05), tüketici paralellik tavanı ölçülebilsin diye
#     tek partition (P06-03). İkisi de üretim için yanlış, öğrenmek için doğru: tüketiciyi
#     çoğaltmanın hiçbir şeyi değiştirmediğini görmeden partition'ların neden önemli olduğunu
#     hissedemezsin.
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  labels:
    app.kubernetes.io/name: redpanda
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
    - name: admin
      port: 9644
      targetPort: admin
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  labels:
    app.kubernetes.io/name: redpanda
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.2.7
          args:
            - redpanda
            - start
            - --smp=1
            - --memory=700M
            - --reserve-memory=0M
            - --overprovisioned
            - --node-id=0
            - --check=false
            - --kafka-addr=PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr=PLAINTEXT://redpanda.$(POD_NAMESPACE).svc.cluster.local:9092
            - --rpc-addr=0.0.0.0:33145
            - --advertise-rpc-addr=$(POD_NAME).redpanda.$(POD_NAMESPACE).svc.cluster.local:33145
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          ports:
            - name: kafka
              containerPort: 9092
            - name: admin
              containerPort: 9644
          resources:
            requests: { cpu: 300m, memory: 768Mi }
            limits: { memory: 1400Mi }
          readinessProbe:
            httpGet: { path: /v1/status/ready, port: admin }
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /v1/status/ready, port: admin }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 4Gi
---
# Topic'leri oluşturan JOB — lifecycle hook DEĞİL.
# EN: The postStart hook did the same thing and silently did nothing: no event, no log, no
#     failure — the broker came up with zero topics and every stream experiment measured a
#     pipeline that could not exist. A Job is observable (`kubectl get job`), retried by
#     Kubernetes, and its failure is visible in the same place you look for everything else.
#     Prefer the mechanism that FAILS LOUDLY over the one that is convenient.
# TR: Aynı işi postStart hook'u yapıyordu ve sessizce hiçbir şey yapmadı: olay yok, log yok,
#     hata yok — broker sıfır topic'le açıldı ve bütün stream deneyleri var olamayacak bir boru
#     hattını ölçtü. Job gözlenebilir (`kubectl get job`), Kubernetes tarafından yeniden denenir
#     ve arızası diğer her şeye baktığın yerde görünür. Kolay olanı değil, YÜKSEK SESLE BOZULANI seç.
apiVersion: batch/v1
kind: Job
metadata:
  name: topics
  labels:
    app.kubernetes.io/name: topics
spec:
  backoffLimit: 30
  template:
    metadata:
      labels:
        app.kubernetes.io/name: topics
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rpk
          image: redpandadata/redpanda:v24.2.7
          command:
            - /bin/sh
            - -c
            - |
              set -e
              rpk -X admin.hosts=redpanda:9644 cluster health >/dev/null
              rpk -X brokers=redpanda:9092 topic create clicks -p 1 -r 1 2>&1 | tail -1
              rpk -X brokers=redpanda:9092 topic create clicks-dlq -p 1 -r 1 2>&1 | tail -1
              rpk -X brokers=redpanda:9092 topic list
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 256Mi }
