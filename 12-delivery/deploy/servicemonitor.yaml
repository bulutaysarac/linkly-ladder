# Altyapı bileşenlerinin KENDİ metrikleri (postgres_exporter, redis_exporter, redpanda admin).
#
# EN: They belong to the infrastructure, not to an app Deployment, so splitting the app into
#     redirect/api (07) must not take them away — and their absence would not fail loudly.
#     `promq` returns "0" for a query with no series, so every script that asks "how many DB
#     connections?" or "what is Redis doing?" would silently measure zero and report "no
#     problem" (P07-02 would print max_connections=0).
#     A metric that does not exist and a metric that is zero look identical downstream.
# TR: Bunlar bir uygulama Deployment'ına değil altyapıya ait; uygulamayı redirect/api diye
#     bölmek (07) onları götürmemeli — götürseydi hiçbir şey yüksek sesle bozulmazdı. `promq`,
#     serisi olmayan bir sorguya "0" döndürür; dolayısıyla "kaç DB bağlantısı var?" ya da "Redis
#     ne yapıyor?" diye soran her script sessizce sıfır ölçüp "sorun yok" derdi (P07-02
#     max_connections=0 basardı).
#     Var olmayan bir metrik ile sıfır olan bir metrik, aşağı akışta AYNI görünür.
#     Kural: bir metriğin varlığını doğrulamadan ona dayanan bir karar verme (`prom_absent`).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  endpoints:
    - port: metrics
      interval: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redpanda
  labels:
    app.kubernetes.io/name: redpanda
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  endpoints:
    - port: admin
      path: /public_metrics
      interval: 10s
